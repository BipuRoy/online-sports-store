# ============ SPORTX Application Configuration ============
spring.application.name=sportx

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/sportx_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Server ----
server.port=8080

# ---- File upload (product images) ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
sportx.upload.dir=uploads

# ---- JWT ----
sportx.jwt.secret=SportXSecretKeyForJwtSigningMustBeAtLeast256BitsLongForHS256Algorithm2026
sportx.jwt.expiration-ms=86400000

# ---- Seed sample data on first run ----
sportx.seed.enabled=true

# ---- Logging ----
logging.level.com.sportx=INFO
